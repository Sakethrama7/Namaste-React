<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>React</title>
  </head>
  <body>
    <div id="root">
      <!--
         <h1>Hello World from HTML!</h1>
     -->
    </div>

    <div id="root1"></div>
    <div id="root2"></div>
    <div id="root3"></div>

    <!-- JavaScript Code to print Hello World.

     <script>

        const heading = document.createElement("h1");
        heading.innerHTML="Hello World from JavaScript!";

        const root=document.getElementById("root");
        root.appendChild(heading);

           
     </script>
    -->

    <!--

       1. Generally Browser can't understand React code. So we need to import some Links to our project. Those are nothing but CDN links of React.
       2. These Links contains the Javascript code. By importing this into our project we can use React components and now browser can understand it well.
       3. This First file react.development.js is the core file of react.
       4. The Second file react-dom.development.js is useful for DOM operations. Also it acts like a bridge between react and browser.

    -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!--
      <script>
        // React code to print Hello world.

        // This Line is used to create a Element using React. Creating a Element is a part of React core so we used React here.
        /* 
            Also this createElement() in React takes three parameters 
            1. What type of tag u want to create.
            2. Passing of Objects.
            3. What Information u want to put in that tag.
        */
        const heading = React.createElement("h1",{},"Hello World from React");

        /* 
            This Second Line is used to create a root in React. This root is place where all the react code will run.
            Here we used React DOM to do DOM Operations. 
            Everything we want to render we will render inside this root.
        */
        const root=ReactDOM.createRoot(document.getElementById("root"));

        // This Line is used to render the information in the browser.
        root.render(heading);
      </script>
    -->

    <script src="./app.js"></script>
  </body>
</html>
